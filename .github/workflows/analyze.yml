name: Analyze new games
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency: analyze
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chess-recap/worker/requirements.txt
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: stockfish
          version: "1.0"
      - run: pip install -r chess-recap/worker/requirements.txt
      - run: python chess-recap/worker/analyze.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
