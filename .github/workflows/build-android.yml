name: Build Elog APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "saucyfy/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

# one build at a time, so the signing key is only ever created once
concurrency:
  group: elog-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every build must be signed with the SAME key, otherwise phones refuse to install
      # a new version over the old one. Created once, then reused from the repo.
      - name: Stable signing key
        run: |
          if [ ! -f saucyfy/keystore/elog.jks ]; then
            mkdir -p saucyfy/keystore
            keytool -genkeypair -keystore saucyfy/keystore/elog.jks -alias elog \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass elogkey123 -keypass elogkey123 \
              -dname "CN=Elog, OU=Elog, O=Elog, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add saucyfy/keystore/elog.jks
            git commit -m "chore: add Elog signing key [skip ci]"
            git push
          fi

      - name: Generate app icons from your artwork
        working-directory: saucyfy
        run: |
          pip install pillow
          python tools/make_icons.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: saucyfy
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Elog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elog-apk
          path: saucyfy/Elog.apk

      - name: Publish release (also what the in-app updater downloads)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elog-build-${{ github.run_number }}
          name: Elog build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: saucyfy/Elog.apk
