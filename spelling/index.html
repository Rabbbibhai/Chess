<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Practice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>">
<style>
:root{--bg:#f6f7f4;--card:#fff;--text:#1d2a1f;--muted:#6b7a6e;--accent:#2f8f4e;--accent-text:#fff;--bad:#c0392b;--good:#2f8f4e;--border:#dfe5dc;--chip:#eaf2ea}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231e;--text:#e8efe9;--muted:#94a398;--accent:#4cc275;--accent-text:#07200f;--bad:#ff6b5b;--good:#4cc275;--border:#2c382f;--chip:#243029}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
p.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
label.t{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--border);background:var(--chip);color:var(--text);padding:8px 12px;border-radius:999px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button{font:inherit}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:1rem;cursor:pointer;width:100%}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--border)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prompt{text-align:center;padding:10px 0 16px}
.speak{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:2rem;cursor:pointer}
.pattern{font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;letter-spacing:.15em;margin-top:14px;word-break:break-word}
.showword{font-size:2rem;font-weight:700;margin:10px 0}
input[type=text]{width:100%;font-size:1.3rem;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--text);text-align:center;margin-bottom:12px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.fb{text-align:center;font-size:1.1rem;min-height:1.6em;margin-bottom:12px;font-weight:600}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;letter-spacing:.05em}
.diff .ok{color:var(--good)}.diff .no{color:var(--bad);text-decoration:underline}
.big{font-size:3rem;text-align:center;font-weight:700;margin:6px 0}
.list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.list span{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:.9rem}
.mastery{color:var(--muted);font-size:.85rem;margin-top:10px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
</style>
</head>
<body>
<main>
<h1>🥗 Spelling Practice</h1>
<p class="sub">Health, food &amp; fitness vocabulary</p>

<!-- Setup -->
<section id="setup" class="card">
  <label class="t">Mode</label>
  <div class="chips" id="modes">
    <button class="chip" data-mode="listen" aria-pressed="true">🔊 Listen &amp; spell</button>
    <button class="chip" data-mode="look" aria-pressed="false">👀 Look, cover, write</button>
    <button class="chip" data-mode="hint" aria-pressed="false">🔤 Letter hints</button>
  </div>
  <label class="t">Word groups</label>
  <div class="chips" id="groups"></div>
  <button class="btn" id="start">Start practice</button>
  <div class="mastery" id="mastery"></div>
  <div style="text-align:center;margin-top:6px"><button class="link" id="reset">Reset progress</button></div>
</section>

<!-- Quiz -->
<section id="quiz" class="card hidden">
  <div class="top"><span id="count"></span><span id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="prompt">
    <div id="listenBox"><button class="speak" id="speak" aria-label="Hear the word">🔊</button></div>
    <div id="lookBox" class="hidden"><div class="showword" id="showword"></div><div style="color:var(--muted)" id="lookTimer"></div></div>
    <div class="pattern" id="pattern"></div>
  </div>
  <input type="text" id="answer" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type the word…">
  <div class="fb" id="fb"></div>
  <div class="row">
    <button class="btn sec" id="hintBtn">Hint</button>
    <button class="btn" id="check">Check</button>
  </div>
  <div style="text-align:center;margin-top:8px"><button class="link" id="quit">End practice</button></div>
</section>

<!-- Results -->
<section id="results" class="card hidden">
  <label class="t">Round complete</label>
  <div class="big" id="final"></div>
  <div id="missedWrap" class="hidden">
    <label class="t">Words to practise again</label>
    <div class="list" id="missedList"></div>
    <button class="btn" id="again" style="margin-bottom:10px">Practise missed words</button>
  </div>
  <button class="btn sec" id="home">Back to start</button>
</section>
</main>

<script>
const GROUPS = {
  "Fitness & health": ["yoga","tai-chi","keep-fit","salad bar","vegetarian","outdoor activities","leisure time","disease","regular exercise"],
  "Nutrition": ["meal","protein","balanced diet","food pyramid","vitamin","carbohydrates","minerals","zinc"],
  "Foods": ["rice","pasta","potatoes","pizza","tomatoes","bread","cereals","meat","seafood","eggs","beans","milk","cheese","yoghurt","fruit","vegetables","citrus fruits","green pepper","blackcurrant","nuts","egg yolk","liver"],
  "Health care": ["medicine treatment","remedy","nursing care","nursery"]
};
const ALL = Object.values(GROUPS).flat();
const $ = id => document.getElementById(id);
let mode = "listen", selected = new Set(Object.keys(GROUPS));
let queue = [], idx = 0, correct = 0, missed = [], attempts = 0, hintLevel = 0, current = "", locked = false, lookTimeout = null;

// progress (best effort; storage may be unavailable)
let progress = {};
try { progress = JSON.parse(localStorage.getItem("spell-progress") || "{}"); } catch (e) { progress = {}; }
function save(){ try { localStorage.setItem("spell-progress", JSON.stringify(progress)); } catch (e) {} }
function mastered(w){ return (progress[w] || 0) >= 2; }
function showMastery(){ const n = ALL.filter(mastered).length; $("mastery").textContent = n + " of " + ALL.length + " words mastered (spelled right twice)"; }

// setup UI
const gEl = $("groups");
for (const g of Object.keys(GROUPS)) {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.textContent = g + " (" + GROUPS[g].length + ")";
  b.onclick = () => {
    if (selected.has(g)) { if (selected.size > 1) selected.delete(g); } else selected.add(g);
    b.setAttribute("aria-pressed", selected.has(g));
  };
  gEl.appendChild(b);
}
document.querySelectorAll("#modes .chip").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll("#modes .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
});

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s){ return s.toLowerCase().replace(/\s+/g, " ").trim(); }
function show(id){ ["setup","quiz","results"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

function speak(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/-/g, " "));
  u.lang = "en-GB"; u.rate = 0.85;
  speechSynthesis.speak(u);
}
function pattern(w, reveal){
  return w.split("").map((c, i) => c === " " ? "  " : c === "-" ? "-" : (i < reveal ? c : "_")).join(" ");
}

function begin(words){
  queue = shuffle(words); idx = 0; correct = 0; missed = [];
  show("quiz"); loadWord();
}
function loadWord(){
  clearTimeout(lookTimeout);
  current = queue[idx]; attempts = 0; hintLevel = 0; locked = false;
  $("count").textContent = "Word " + (idx + 1) + " of " + queue.length;
  $("score").textContent = "✓ " + correct;
  $("prog").style.width = (idx / queue.length * 100) + "%";
  $("answer").value = ""; $("answer").disabled = false;
  $("fb").textContent = ""; $("fb").className = "fb";
  $("check").textContent = "Check";
  $("hintBtn").classList.remove("hidden");
  $("listenBox").classList.toggle("hidden", mode === "look");
  $("lookBox").classList.toggle("hidden", mode !== "look");
  // pattern: always show the shape of the word (spaces and hyphens), reveal letters via hints
  $("pattern").textContent = mode === "hint" ? pattern(current, 1) : pattern(current, 0);
  if (mode === "hint") hintLevel = 1;
  if (mode === "listen") setTimeout(() => speak(current), 250);
  if (mode === "look") runLook();
  else $("answer").focus();
}
function runLook(){
  $("showword").textContent = current;
  $("answer").disabled = true; $("pattern").textContent = "";
  let t = Math.max(3, Math.ceil(current.length / 3));
  const tick = () => {
    if (t <= 0) {
      $("showword").textContent = "✏️ Now write it"; $("lookTimer").textContent = "";
      $("pattern").textContent = pattern(current, 0);
      $("answer").disabled = false; $("answer").focus(); return;
    }
    $("lookTimer").textContent = "Memorise it… " + t + "s"; t--;
    lookTimeout = setTimeout(tick, 1000);
  };
  tick();
}

function diffHTML(guess, target){
  let out = "";
  for (let i = 0; i < target.length; i++) {
    const ok = guess[i] === target[i];
    out += '<span class="' + (ok ? "ok" : "no") + '">' + (target[i] === " " ? "&nbsp;" : target[i]) + "</span>";
  }
  return out;
}
function next(){
  idx++;
  if (idx >= queue.length) return finish();
  loadWord();
}
function check(){
  if (locked) { next(); return; }
  const guess = norm($("answer").value);
  if (!guess) return;
  const fb = $("fb");
  if (guess === current) {
    if (attempts === 0) { correct++; progress[current] = (progress[current] || 0) + 1; }
    else { progress[current] = 0; }
    save();
    fb.className = "fb good"; fb.textContent = attempts === 0 ? "✓ Correct!" : "✓ Got it — keep practising this one";
    $("score").textContent = "✓ " + correct;
    locked = true; $("answer").disabled = true; $("hintBtn").classList.add("hidden");
    $("check").textContent = "Next →";
    setTimeout(() => { if (locked && idx < queue.length && queue[idx] === current && fb.className.includes("good")) { /* stay for user tap */ } }, 0);
    return;
  }
  attempts++;
  if (!missed.includes(current)) missed.push(current);
  progress[current] = 0; save();
  if (attempts < 2) {
    fb.className = "fb bad"; fb.textContent = "Not quite — try once more";
    $("answer").select();
  } else {
    fb.className = "fb bad";
    fb.innerHTML = '<div class="diff">' + diffHTML(guess, current) + '</div><div style="font-weight:400;font-size:.9rem;margin-top:6px">Correct spelling shown above</div>';
    locked = true; $("answer").disabled = true; $("hintBtn").classList.add("hidden");
    $("check").textContent = "Next →";
  }
}
function hint(){
  if (mode === "look" && $("answer").disabled) return;
  hintLevel = Math.min(current.length, hintLevel + 1);
  $("pattern").textContent = pattern(current, hintLevel);
  if (mode === "listen") speak(current);
  $("answer").focus();
}
function finish(){
  clearTimeout(lookTimeout);
  $("prog").style.width = "100%";
  $("final").textContent = correct + " / " + queue.length;
  $("missedWrap").classList.toggle("hidden", missed.length === 0);
  $("missedList").innerHTML = "";
  missed.forEach(w => { const s = document.createElement("span"); s.textContent = w; $("missedList").appendChild(s); });
  show("results");
}

$("start").onclick = () => {
  const words = [...selected].flatMap(g => GROUPS[g]);
  begin(words);
};
$("check").onclick = check;
$("hintBtn").onclick = hint;
$("speak").onclick = () => { speak(current); $("answer").focus(); };
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("quit").onclick = () => { clearTimeout(lookTimeout); speechSynthesis && speechSynthesis.cancel(); finish(); };
$("again").onclick = () => begin(missed.slice());
$("home").onclick = () => { showMastery(); show("setup"); };
$("reset").onclick = () => { progress = {}; save(); showMastery(); };
showMastery();
</script>
</body>
</html>
